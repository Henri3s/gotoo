name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (leave empty to use tag name)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Release macOS App
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Release
        run: |
          xcodebuild -project gotoo.xcodeproj \
            -scheme gotoo \
            -destination 'platform=macOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_APP_SANDBOX=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            SYMROOT="build" \
            clean build \
            2>&1 | tail -5

      - name: Prepare App
        run: |
          APP_PATH="build/Release/gotoo.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App not found at $APP_PATH"
            find build -name "gotoo.app" -type d
            exit 1
          fi
          
          # Remove debug symbols
          rm -f "$APP_PATH/Contents/MacOS/__preview.dylib" 2>/dev/null || true
          rm -f "$APP_PATH/Contents/MacOS/gotoo.debug.dylib" 2>/dev/null || true
          
          # Strip extended attributes
          xattr -cr "$APP_PATH"
          
          # Ad-hoc sign
          codesign --force --deep --sign - "$APP_PATH"
          
          echo "App size: $(du -sh "$APP_PATH" | cut -f1)"

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          hdiutil create \
            -volname "Gotoo ${VERSION}" \
            -srcfolder "build/Release/gotoo.app" \
            -ov \
            -format UDZO \
            "Gotoo-${VERSION}.dmg"

      - name: Generate Checksums
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          shasum -a 256 "Gotoo-${VERSION}.dmg" > checksums.txt
          cat checksums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gotoo-macOS-${{ steps.version.outputs.version }}
          path: |
            Gotoo-*.dmg
            checksums.txt
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Gotoo ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            Gotoo-*.dmg
            checksums.txt
          body: |
            ## Gotoo ${{ github.ref_name }}

            **智能文件管理器 — 规则驱动 + AI 加持**

            ### 下载安装

            1. 下载下方 `Gotoo-*.dmg` 文件
            2. 双击打开 DMG，拖拽 Gotoo.app 到「应用程序」文件夹
            3. **首次打开**：右键点击 Gotoo → 选择「打开」→ 在弹窗中再次点击「打开」

            > 如果提示"无法验证开发者"，在终端执行：
            > ```
            > xattr -cr /Applications/Gotoo.app
            > ```

            ### 系统要求
            - macOS 15.0 (Sequoia) 或更高版本
            - Apple Silicon (M1/M2/M3/M4) 或 Intel Mac

            ### 校验
            ```
            shasum -a 256 Gotoo-*.dmg
            ```
            与 `checksums.txt` 比对确认文件完整性。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
