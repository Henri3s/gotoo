name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build macOS App
    runs-on: macos-15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Release
        run: |
          xcodebuild -project gotoo.xcodeproj \
            -scheme gotoo \
            -destination 'platform=macOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_APP_SANDBOX=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            build

      - name: Prepare App
        run: |
          APP_PATH="$(find ~/Library/Developer/Xcode/DerivedData/gotoo-*/Build/Products/Release/gotoo.app -maxdepth 0 | head -1)"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          
          # Remove quarantine flag and debug symbols
          cp -R "$APP_PATH" /tmp/Gotoo.app
          rm -rf /tmp/Gotoo.app/Contents/MacOS/__preview.dylib 2>/dev/null || true
          rm -rf /tmp/Gotoo.app/Contents/MacOS/gotoo.debug.dylib 2>/dev/null || true
          
          # Ad-hoc sign the app
          codesign --force --deep --sign - /tmp/Gotoo.app

      - name: Create DMG
        run: |
          brew install create-dmg 2>/dev/null || true
          
          VERSION="${GITHUB_REF_NAME#v}"
          
          create-dmg \
            --volname "Gotoo $VERSION" \
            --volicon "/tmp/Gotoo.app/Contents/Resources/AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Gotoo.app" 175 190 \
            --app-drop-link 425 190 \
            --hide-extension "Gotoo.app" \
            "Gotoo-${VERSION}.dmg" \
            /tmp/Gotoo.app

      - name: Generate SHA256
        run: |
          shasum -a 256 Gotoo-*.dmg > checksums.txt
          cat checksums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gotoo-macOS
          path: |
            Gotoo-*.dmg
            checksums.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Gotoo ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            Gotoo-*.dmg
            checksums.txt
          body: |
            ## Gotoo ${{ github.ref_name }}
            
            **智能文件管理器 — 规则驱动 + AI 加持**
            
            ### 下载安装
            
            1. 下载 `Gotoo-*.dmg`
            2. 双击打开 DMG，拖拽 Gotoo 到「应用程序」文件夹
            3. **首次打开**：右键点击 Gotoo → 选择「打开」→ 在弹窗中再次点击「打开」
            
            > 如果提示"无法验证开发者"，在终端执行：
            > ```
            > xattr -cr /Applications/Gotoo.app
            > ```
            
            ### 系统要求
            - macOS 15.0 (Sequoia) 或更高版本
            - Apple Silicon (M1/M2/M3/M4) 或 Intel Mac
            
            ### 功能
            - 多面板文件浏览器（单栏/双栏/三栏）
            - 自动化规则引擎（30+ 条件类型，15 种动作）
            - AI 文件助手（支持任意 OpenAI 兼容 API）
            - 技能系统（6 个内置技能，支持自定义）
            - 文件夹级提示词配置
            - 规则模板市场（10 个预设模板）
            - 操作历史 + 撤销栈
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
